[versions]
# Minecraft
minecraft1201 = "1.20.1"
minecraft1211 = "1.21.1"
fabric = "0.16.9"
forge1201 = "47.3.0"
neoforge1211 = "21.1.233"
# Common
cloche = "0.18.14"
kotlin = "2.2.10"
parchment1201 = "2023.09.03"
parchment1211 = "2024.11.17"
mixin = "0.8.3"
mixinextras = "0.5.3"
kotlinx-serialization = "1.8.0"
kotlinx-coroutines = "1.10.1"
bytecodecs = "1.0.2"
kritter = "2.0.0-alpha.51"
# Fabric
fapi1201 = "0.92.2"
fapi1211 = "0.116.12"
fabrickotlin = "1.11.0+kotlin.2.0.0"
# Forge
klf = "2.10.5-k2.2.10-2.0+forge"
kff1201 = "4.12.0"
kff1211 = "5.11.0"

[libraries]
# Common
javax-annotations = { module = "javax.annotation:javax.annotation-api", version = "1.3.2" }
mixin = { module = "org.spongepowered:mixin", version.ref = "mixin" }
mixinextras = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
# Intentionally using latest kt metadata version for more compatibility
kotlin-metadata = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version = "2.1.20" }
bytecodecs = { module = "com.teamresourceful:bytecodecs", version.ref = "bytecodecs" }
nullevt = { module = "invoke.kitty:nullevt", version = "2.2.8" }

# Fabric
fabric-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabrickotlin" }
fabric-kritter1201 = { module = "invoke.kitty.kritter:kritter-1.20.1-fabric", version.ref = "kritter" }
fabric-kritter1211 = { module = "invoke.kitty.kritter:kritter-1.21.1-fabric", version.ref = "kritter" }

# Forge
forge-kotlin1201 = { module = "thedarkcolour:kotlinforforge", version.ref = "kff1201" }
forge-kotlin1211 = { module = "thedarkcolour:kotlinforforge-neoforge", version.ref = "kff1211" }
forge-mixinextras = { module = "io.github.llamalad7:mixinextras-forge", version.ref = "mixinextras" }
forge-kritter1201 = { module = "invoke.kitty.kritter:kritter-1.20.1-forge", version.ref = "kritter" }
forge-kritter1211 = { module = "invoke.kitty.kritter:kritter-1.21.1-neoforge", version.ref = "kritter" }
forge-kritter1201-lang = { module = "invoke.kitty.kritter:kritter-1.20.1-forge-lang", version.ref = "kritter" }
forge-kritter1211-lang = { module = "invoke.kitty.kritter:kritter-1.21.1-neoforge-lang", version.ref = "kritter" }
nullbus = { module = "uwu.serenity:nullbus", version = "1.7.3" }

[bundles]

[plugins]
cloche = { id = "earth.terrarium.cloche", version.ref = "cloche" }
modpublish = { id = "me.modmuss50.mod-publish-plugin", version = "1.1.0" }